name: Pull Request
on:
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  nix-build:
    uses: ./.github/workflows/nix-build.yml
    permissions:
      id-token: write
      contents: read

  build-windows-msvc:
    uses: ./.github/workflows/build-windows-msvc.yml
